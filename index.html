<div class="profile-form-group">
    <label>Profile Picture (Upload JPG/PNG)</label>
    <div style="display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; border: 1px solid var(--accent-purple);">
        <img id="profPicPreview" src="" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-cyan); background: #333;">
        <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
            <input type="file" id="profPicFile" accept="image/*" style="color: #fff; font-size: 0.9rem;">
            <button type="button" onclick="removeProfilePic()" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; width: fit-content;">Remove Picture</button>
        </div>
    </div>
</div>
